ci:
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c" # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253 # frozen: v0.16.10
    hooks:
      - id: ruff-format
        exclude: ^content/week01/cleanup_bessel\.ipynb$

  - repo: https://github.com/adamchainz/blacken-docs
    rev: dda8db18cfc68df532abf33b185ecd12d5b7b326 # frozen: 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==26.*]

  - repo: https://github.com/kynan/nbstripout
    rev: f5da19ce3b7b40e97c12ee9cd8ce97f48f97ddf7 # frozen: 0.9.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: "83cecb6b523a053d7d3dfdc4798d705b505a88f9" # frozen: v0.2.78
    hooks:
      - id: rumdl-fmt

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "ef4a397f916211b4a39ccf9d3d9cbb6562157251" # frozen: v3.9.9
    hooks:
      - id: prettier
        exclude: '(\.md$|(^|/)pixi\.lock$)' # Markdown is handled by rumdl; pixi.lock is generated by pixi (see .gitattributes)

  - repo: https://github.com/codespell-project/codespell
    rev: "57b21406f092110c18776e39b0bda50d37c945c8" # frozen: v2.4.3
    hooks:
      - id: codespell
        args: ["-L", "hist,whet,classe,nd", "-w"]
        exclude: "bun.lock"

  - repo: local
    hooks:
      - id: disallow-caps
        name: Disallow improper capitalization
        language: pygrep
        entry: PyBind|Numpy|Cmake|CCache|Github|PyTest
        exclude: ^(.pre-commit-config.yaml|content/week04_package/precommit.md)$

  - repo: https://github.com/PrincetonUniversity/blocklint
    rev: e615ce15d9b6e78c0c776a01884fe35637346ad0 # frozen: v0.3.0
    hooks:
      - id: blocklint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
    hooks:
      - id: zizmor
        files: "^\\.github"
        args: [--persona=auditor]
