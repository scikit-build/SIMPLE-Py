ci:
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c" # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: cb8c523fd4835aba42af70f4cad5568db4df0b6c # frozen: v0.16.0
    hooks:
      - id: ruff-format
        exclude: ^content/week01/cleanup_bessel\.ipynb$

  - repo: https://github.com/adamchainz/blacken-docs
    rev: fda77690955e9b63c6687d8806bafd56a526e45f # frozen: 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==26.*]

  - repo: https://github.com/kynan/nbstripout
    rev: 34071b78c181af3bf5af955c1426466e096fc3db # frozen: 0.9.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: "75cad3ecfe02b58e8165d3ac08d117bee207ed3d" # frozen: v0.2.43
    hooks:
      - id: rumdl-fmt

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "0ee178619d696787ca73d210cc191d720868c631" # frozen: v3.9.6
    hooks:
      - id: prettier
        exclude: '(\.md$|(^|/)pixi\.lock$)' # Markdown is handled by rumdl; pixi.lock is generated by pixi (see .gitattributes)

  - repo: https://github.com/codespell-project/codespell
    rev: "57b21406f092110c18776e39b0bda50d37c945c8" # frozen: v2.4.3
    hooks:
      - id: codespell
        args: ["-L", "hist,whet,classe,nd", "-w"]
        exclude: "bun.lock"

  - repo: local
    hooks:
      - id: disallow-caps
        name: Disallow improper capitalization
        language: pygrep
        entry: PyBind|Numpy|Cmake|CCache|Github|PyTest
        exclude: ^(.pre-commit-config.yaml|content/week04_package/precommit.md)$

  - repo: https://github.com/PrincetonUniversity/blocklint
    rev: e615ce15d9b6e78c0c776a01884fe35637346ad0 # frozen: v0.3.0
    hooks:
      - id: blocklint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 067260dc5fe6ea86b7551bfd6f8b3ba4e6c93129 # frozen: v1.28.0
    hooks:
      - id: zizmor
        files: "^\\.github"
        args: [--persona=auditor]
