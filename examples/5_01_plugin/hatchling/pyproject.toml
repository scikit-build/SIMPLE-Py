[build-system]
requires = ["hatchling", "scikit-build-core[hatchling]>=1"]
build-backend = "hatchling.build"

[project]
name = "hatchling_example"
version = "0.1.0"

[tool.hatch.build.targets.wheel.hooks.scikit-build]

# Rebuild the editable install when the build config or C sources change
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "src/**/*.c" },
]
